name: docs-dispatch

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/notes/**'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: tabai-cloud/docs
          event-type: docs-updated
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
